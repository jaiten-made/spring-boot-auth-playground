spring.application.name=preperation

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (so you can view the database in your browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' will automatically create/update database tables to match your Java code
spring.jpa.hibernate.ddl-auto=update
# This prints the generated SQL queries to your terminal console so you can see what JPA is doing
spring.jpa.show-sql=true

# Error Handling configuration: include error messages in default JSON bodies
server.error.include-message=always
